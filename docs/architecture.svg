<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="430" fill="#0d1117"/>
  <text x="450" y="34" fill="#c9d1d9" font-size="19" font-weight="700" text-anchor="middle">privacy-kit · flujo de cumplimiento Ley 21.719</text>

  <!-- Cliente -->
  <rect x="30" y="150" width="150" height="130" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="105" y="205" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">Cliente</text>
  <text x="105" y="228" fill="#8b949e" font-size="12" text-anchor="middle">(WhatsApp)</text>

  <!-- privacy-kit layer -->
  <rect x="255" y="70" width="360" height="290" rx="12" fill="#0f2b46" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="435" y="98" fill="#5fb0ff" font-size="15" font-weight="700" text-anchor="middle">privacy-kit  (capa acoplable)</text>

  <!-- controls -->
  <g font-size="12.5" fill="#c9d1d9">
    <rect x="278" y="115" width="314" height="34" rx="6" fill="#161b22" stroke="#30363d"/><text x="292" y="137">1 · aviso de privacidad + base de licitud</text>
    <rect x="278" y="157" width="314" height="34" rx="6" fill="#161b22" stroke="#30363d"/><text x="292" y="179">2 · auditoría (evidencia, sin PII en claro)</text>
    <rect x="278" y="199" width="314" height="34" rx="6" fill="#1c3a24" stroke="#238636"/><text x="292" y="221" fill="#56d364" font-weight="700">3 · minimización → redact(PII)  ★</text>
    <rect x="278" y="241" width="314" height="34" rx="6" fill="#161b22" stroke="#30363d"/><text x="292" y="263">4 · registro de transferencia a terceros</text>
    <rect x="278" y="283" width="150" height="34" rx="6" fill="#161b22" stroke="#30363d"/><text x="292" y="305">5 · derechos ARCOP</text>
    <rect x="442" y="283" width="150" height="34" rx="6" fill="#161b22" stroke="#30363d"/><text x="456" y="305">6 · retención/borrado</text>
  </g>

  <!-- LLM -->
  <rect x="720" y="150" width="150" height="130" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="795" y="205" fill="#ff7b72" font-size="15" font-weight="700" text-anchor="middle">LLM</text>
  <text x="795" y="228" fill="#8b949e" font-size="11" text-anchor="middle">Anthropic / OpenAI</text>
  <text x="795" y="248" fill="#56d364" font-size="11" text-anchor="middle">sin PII real</text>

  <!-- arrows -->
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/></marker></defs>
  <line x1="180" y1="200" x2="253" y2="200" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="617" y1="216" x2="718" y2="216" stroke="#56d364" stroke-width="2" marker-end="url(#a)"/>
  <text x="668" y="208" fill="#56d364" font-size="10" text-anchor="middle">[RUT_ab12]</text>
  <line x1="718" y1="250" x2="617" y2="250" stroke="#8b949e" stroke-width="2" marker-end="url(#a)" stroke-dasharray="4"/>
  <text x="668" y="270" fill="#8b949e" font-size="10" text-anchor="middle">respuesta</text>
  <line x1="253" y1="250" x2="182" y2="250" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="217" y="242" fill="#58a6ff" font-size="10" text-anchor="middle">rehidratada</text>

  <text x="450" y="400" fill="#8b949e" font-size="12.5" text-anchor="middle">El dato personal nunca viaja en claro a un tercero · todo tratamiento deja evidencia · el cliente ejerce sus derechos desde el bot</text>
</svg>
